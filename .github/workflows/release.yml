name: Release

# Push a tag like v0.2.0 and everything below happens: binaries for every
# target go onto a GitHub Release, the crate goes to crates.io, and only then
# does the release become visible. Nothing is manual after the tag.
#
# One-time setup, because crates.io can only trust a workflow for a crate that
# already exists:
#   1. Publish the first version by hand: `cargo login`, then `cargo publish`.
#   2. On crates.io, open the crate's Settings > Trusted Publishing and add
#      GitHub with owner Bridiro, repository tuican, workflow release.yml,
#      environment release.
#   3. Push the tag. The crate job sees the version is already published and
#      skips it; every later tag publishes on its own.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Cargo.toml says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

  draft:
    name: draft the release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Draft until every binary is attached and the crate is published, so a
      # half-finished release is never the one people see.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: ${{ matrix.target }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          # Linux goes through Zig, the same way the Pi job in ci.yml and the
          # README do. The .2.31 suffix pins the glibc floor to Bullseye, so
          # the binaries run on any distro from 2021 on; it is used for the
          # build and stripped from the archive name.
          - target: x86_64-unknown-linux-gnu.2.31
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu.2.31
            os: ubuntu-latest
            build-tool: cargo-zigbuild
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        if: matrix.build-tool == 'cargo-zigbuild'
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: matrix.build-tool == 'cargo-zigbuild'
        with:
          tool: cargo-zigbuild@0.23.4

      # libusb compiled in, so the binary needs nothing installed beyond libc.
      #
      # The archive name is one cargo-binstall looks for by default, so
      # `cargo binstall tuican` works with no metadata in Cargo.toml.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tuican
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          no-default-features: true
          features: vendored-libusb
          token: ${{ secrets.GITHUB_TOKEN }}

  crate:
    name: crates.io
    needs: binaries
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # A version published by hand (the first one has to be, see the top of
      # this file) must not fail the run. Publishing is the one irreversible
      # step, so it is checked for rather than retried.
      - name: Is this version already on crates.io?
        id: exists
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "tuican-release (github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/tuican/$version")
          echo "published=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.exists.outputs.published == 'false'
        id: auth
      - run: cargo publish
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish:
    name: publish the release
    needs: crate
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
