# tuican reaction rules.
#
# Copy this next to your DBC as `tuican.rules.toml` and tuican finds it on its
# own, or pass it with `--rules FILE`. F7 reloads it without restarting, F6
# shows the panel.
#
# A rule watches signals and, when its condition becomes true, does something.
# Rules fire on the rising edge, so a rule watching `state == 2` fires once when
# the state reaches 2, not on every frame while it stays there.
#
# Rules are independent, so several can react to the same frame. That is the
# parallel case. A rule can also watch a signal you are *sending*
# (`source = "tx"`), which is how one rule's action satisfies another rule's
# condition in the same tick. That is the series case. Together they give you a
# graph rather than a list.

# --- a parallel pair: both react to the same incoming signal ----------------

[[rule]]
name = "enable on ready"
all = [
  { message = "EphorusInverter1TelemetryA", signal = "inverterReady", op = "eq", value = 1 },
]
then = [
  { action = "set", message = "EphorusInverter1Setpoints", signal = "enableInverter", value = 1 },
  { action = "cyclic", message = "EphorusInverter1Setpoints", period_ms = 10 },
]

[[rule]]
name = "clear errors on ready"
all = [
  { message = "EphorusInverter1TelemetryA", signal = "inverterReady", op = "eq", value = 1 },
]
then = [
  { action = "set", message = "EphorusInverter1Setpoints", signal = "resetError", value = 1 },
]

# --- other things you can write ---------------------------------------------

# `any` holds when at least one of its conditions does; combine it with `all`.
# `op = "changed"` fires on any change of value, whatever it changed to.
# `enabled = false` loads a rule switched off; enter toggles it in the panel.
#
# [[rule]]
# name = "react to a heartbeat stalling or faulting"
# enabled = false
# all = [{ message = "Bms", signal = "state", op = "ne", value = 0 }]
# any = [
#   { message = "Bms", signal = "counter", op = "changed" },
#   { message = "Bms", signal = "fault", op = "ge", value = 1 },
# ]
# then = [{ action = "send", message = "BmsAck" }]
#
# Operators: eq, ne, lt, le, gt, ge, changed.
# Actions:   set (message, signal, value)
#            send (message)
#            cyclic (message, period_ms)
#            stop (message)
#
# Names are checked against the loaded DBC when the file loads. Anything the
# DBC does not define is flagged in the rules panel rather than silently never
# matching.
