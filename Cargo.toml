[package]
name = "tuican"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cross-platform tool to send, read and parse CAN messages"
repository = "https://github.com/Bridiro/tuican"
license = "Apache-2.0"
readme = "README.md"
keywords = ["can", "canbus", "dbc", "tui", "socketcan"]
categories = ["command-line-utilities", "embedded", "hardware-support"]
exclude = ["/dbc"]
authors = ["Alessandro Bridi <ale.bridi15@gmail.com>"]

[features]
default = ["vendored-libusb", "udev"]
# Build libusb from source rather than linking the system copy. Needs a C
# compiler; turn it off if libusb-1.0 is already installed.
vendored-libusb = ["rusb/vendored"]
# Fuller serial port enumeration on Linux, so slcan adapters show their vendor
# and product. Needs libudev at build time.
udev = ["serialport/libudev"]

[dependencies]
anyhow = "1.0.104"
can-dbc = "10.0.0"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
directories = "6.0.0"
embedded-can = "0.4.1"
ratatui = "0.30.2"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4.10.0", default-features = false }
thiserror = "2.0.20"
toml = "1.1.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "4.0.0"
